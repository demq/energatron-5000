.s{fill:#fcfcfb}.p{fill:#0b0b0b}.q{fill:#52514e}.ax{stroke:#c3c2b7}.est{stroke:#7a7974}.me{stroke:#2a78d6}.meF{fill:#2a78d6}.estF{fill:#a9a8a2}
.off{fill:#1baf7a}.sh{fill:#eda100}.pk{fill:#e34948}.bw{fill:#2a78d6}.bn{fill:#d8d7d2}.ring{stroke:#fcfcfb}
@media (prefers-color-scheme: dark){.s{fill:#1a1a19}.p{fill:#f0efec}.q{fill:#c3c2b7}.ax{stroke:#52514e}.est{stroke:#a9a8a2}.me{stroke:#3987e5}.meF{fill:#3987e5}
.estF{fill:#7a7974}.off{fill:#199e70}.sh{fill:#c98500}.pk{fill:#e66767}.bw{fill:#3987e5}.bn{fill:#3a3a38}.ring{stroke:#1a1a19}}
