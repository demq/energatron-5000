<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t d">
<title id="t">An estimate versus your measured usage</title>
<desc id="d">Illustrative. A typical-household profile and a measured half-hourly profile with the same daily total but a different shape across off-peak, shoulder and peak windows. Ranking three plans by the estimate and by the measured profile gives a different winner.</desc>
