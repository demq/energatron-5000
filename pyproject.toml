[project]
name = "energatron-5000"
version = "0.1.0.dev0"
description = "Household energy usage analysis and retail offer comparison, local-first."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.14",
    "pandas>=3.1",
    "numpy>=2.5",
    "pyarrow>=26",
    "pyyaml>=6.0",
    "typer>=0.27",
    "filelock>=4.2",
    "tzdata>=2026.5",
    "pypdf>=7.0",
]

[project.scripts]
energatron = "energatron.adapters.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "hypothesis>=6.170",
    "ruff>=0.17",
    "pyright[nodejs]>=1.1.414",
    "import-linter>=2.15",
    "pre-commit>=4.7",
    "pandas-stubs",
    "dvc>=3.67.1",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.19"
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "energatron"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
exclude = ["*.md"]  # ruff 0.17 formats Python blocks inside Markdown; the docs' code blocks are spec text

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-n", "auto", "--dist", "worksteal"]
xfail_strict = true
markers = ["integration: runs git or DVC as subprocesses in scratch repos"]
