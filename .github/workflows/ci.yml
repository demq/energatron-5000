name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -q
      - run: uv run python scripts/privacy_guard.py --mode tool --tracked --no-denylist
      - run: uv run python scripts/check_agent_links.py
  demo:
    # The README quickstart end to end on macOS (P8 spec §10): init --demo with a real `uv sync`, then status.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run energatron init --demo "$RUNNER_TEMP/energatron-demo" --tool-source "$GITHUB_WORKSPACE"
      - name: status and the two reports
        working-directory: ${{ runner.temp }}/energatron-demo
        run: |
          uv run --frozen energatron status --json
          test -f data/reports/recommendations/index.html
          test -f data/reports/usage/index.html
          uv run --frozen energatron diagnose --json
